name: Compile Kernel for AOSP
# this gh workflows is from vbajs
# credits to vbajs

on:
  workflow_dispatch:
    inputs:
      BUILD_TYPE:
        description: 'Choose what to compile'
        required: true
        default: 'VNL'
        type: choice
        options:
          - VNL
          - KSUN
          - RKSU

jobs:
  build:
    name: Compiling by ${{ github.actor }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          
      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install bc build-essential bison flex zip p7zip-full libc6 curl libstdc++6 git wget libssl-dev zstd lld python3 -y

      - name: Set Build Variables
        run: |
          echo "ZIPNAME=Maiar-v1.0-Silmaril-${{ github.event.inputs.BUILD_TYPE }}-$(date '+%Y%m%d-%H%M').zip" >> $GITHUB_ENV

      - name: Set Git identity for ${{ github.actor }}
        run: |
          git config --global user.name "galadriel1402"
          git config --global user.email "galadriel1402@gmail.com"

      - name: Compile without KSU
        # --- FIX: 'run:' was incorrectly indented ---
        if: ${{ github.event.inputs.BUILD_TYPE == 'VNL' }}
        run: |
          patch -p1 < patches/0001-revert-KSU.patch
          patch -p1 < patches/0001-fixed4APatch.patch
          export KSU_BASE=${{ github.event.inputs.BUILD_TYPE }}
          chmod +x scripts/compile.sh
          bash scripts/compile.sh

      - name: Clone KernelSU-Next and compile
        # --- FIX: 'run:' was incorrectly indented ---
        if: ${{ github.event.inputs.BUILD_TYPE == 'KSUN' }}
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next --depth=1 -b next KernelSU
          cd KernelSU && git fetch https://github.com/galadriel1402/KernelSU-Next && git cherry-pick 16fc108^..894c009 && cd ../
          export KSU_BASE=${{ github.event.inputs.BUILD_TYPE }}
          chmod +x scripts/compile.sh
          bash scripts/compile.sh

      - name: Clone RissuKSU and compile
        # --- FIX: 'run:' was incorrectly indented ---
        if: ${{ github.event.inputs.BUILD_TYPE == 'RKSU' }}
        run: |
          git clone https://github.com/rsuntk/KernelSU --depth=1 -b main KernelSU
          export KSU_BASE=${{ github.event.inputs.BUILD_TYPE }}
          chmod +x scripts/compile.sh
          bash scripts/compile.sh

      - name: Zipup outputs
        run: |
          chmod +x scripts/ak3zip.sh
          bash scripts/ak3zip.sh

      - name: Publish release artifact
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIPNAME }}
          name: "v1.0 Silmaril"
          tag_name: build-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
